# Workflow Name
name: quarterly-earnings-tool-infrastructure # ${{ github.event.repository.name }}-infrastructure

# Workflow Triggers
# on:
#   push:
#     branches:
#       - production
#     paths:  
#       - terraform/** # INDICATES EVERYTHING INSIDE TERRAFORM FOLDER IS WHAT WE WANT TO WORK ON
#   workflow_dispatch: # Enables manual trigger for destroy job
# Workflow Triggers
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform: terraform create or destroy'
        required: true
        default: 'apply'
        type: choice
        options:
          - 'apply'
          - 'destroy'

# Environment Variables
env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  S3_BUCKET: ${{ secrets.S3_BUCKET }}
  AWS_REGION: ${{ vars.AWS_REGION }}
  EKS_CLUSTER: ${{ vars.EKS_CLUSTER }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}


# Define Jobs
jobs:
  terraform:
    name: "Create Infra with Terraform on AWS"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Run only on push events
    if: github.event.inputs.action == 'apply'

    defaults:
      run:
        shell: bash
        working-directory: ./terraform

    steps: # Can find these & MORE on Github Marketplace (https://github.com/marketplace?type=actions)
      - name: Checkout source code
        uses: actions/checkout@v4 # CHECKS OUT CODE

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }} # env. bc we DEFINED THEM ABOVE
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Wait for existing cluster deletion
        run: |
          echo "Checking if EKS cluster exists..."
          if aws eks describe-cluster --name ${{ env.EKS_CLUSTER }} &>/dev/null; then
            CLUSTER_STATUS=$(aws eks describe-cluster --name ${{ env.EKS_CLUSTER }} --query 'cluster.status' --output text)
            echo "Cluster status: $CLUSTER_STATUS"
            
            if [ "$CLUSTER_STATUS" = "DELETING" ]; then
              echo "Cluster is being deleted. Waiting for deletion to complete..."
              aws eks wait cluster-deleted --name ${{ env.EKS_CLUSTER }}
              echo "Cluster deletion completed."
            fi
          else
            echo "No existing cluster found."
          fi

      - name: Setup Terraform # Action that allows us to perform TERRAFORM COMMANDS
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        id: init
        run: terraform init -backend-config="bucket=${{ env.S3_BUCKET }}" -backend-config="key=terraform/state/terraform.tfstate"

      - name: Terraform validate
        id: validate
        run: terraform validate

      - name: Terraform plan
        id: plan
        run: terraform plan -no-color -input=false -out planfile # Workflow NOT interactive, simply generate PLAN for us
        continue-on-error: true

      - name: Terraform plan status
        if: steps.plan.outcome == 'failure'
        run: exit 1

      - name: Terraform apply
        id: apply
        run: terraform apply -auto-approve -input=false -parallelism=1 planfile # parallelism=1 means we want to run ONE STEP AT A TIME

      - name: Get Kubernetes config
        id: getconfig
        if: steps.apply.outcome == 'success' # If 
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER }} --region ${{ env.AWS_REGION }} 

      - name: Pre-destroy cleanup
        if: failure()
        run: |
            echo "Starting comprehensive pre-destroy cleanup..."
            
            # Install jq if needed
            sudo apt-get update && sudo apt-get install -y jq
            
            # Delete ArgoCD Application first
            kubectl delete application quarterly-earnings-tool -n argocd --ignore-not-found=true --timeout=60s || true
            
            # Convert LoadBalancer to ClusterIP and delete namespace
            kubectl patch svc argocd-server -n argocd -p '{"spec":{"type":"ClusterIP"}}' --ignore-not-found=true || true
            sleep 30
            kubectl delete namespace argocd --ignore-not-found=true --timeout=180s || true
            
            # Clean up LoadBalancers more efficiently
            echo "Cleaning up LoadBalancers..."
            
            # Delete Application Load Balancers
            aws elbv2 describe-load-balancers \
              --query "LoadBalancers[?contains(LoadBalancerName, '${{ env.EKS_CLUSTER }}')].LoadBalancerArn" \
              --output text | while read -r lb_arn; do
              if [ ! -z "$lb_arn" ]; then
                echo "Deleting ALB/NLB: $lb_arn"
                aws elbv2 delete-load-balancer --load-balancer-arn "$lb_arn" || true
              fi
            done
            
            # Delete Classic Load Balancers
            aws elb describe-load-balancers \
              --query "LoadBalancerDescriptions[?contains(LoadBalancerName, '${{ env.EKS_CLUSTER }}')].LoadBalancerName" \
              --output text | while read -r lb_name; do
              if [ ! -z "$lb_name" ]; then
                echo "Deleting Classic LB: $lb_name"
                aws elb delete-load-balancer --load-balancer-name "$lb_name" || true
              fi
            done
            
            # Empty ECR Repository
            if aws ecr describe-repositories --repository-names ${{ env.ECR_REPOSITORY }} &>/dev/null; then
              IMAGES=$(aws ecr list-images --repository-name ${{ env.ECR_REPOSITORY }} --query 'imageIds[*]' --output json)
              if [ "$IMAGES" != "[]" ]; then
                echo "Deleting images from ${{ env.ECR_REPOSITORY }}..."
                aws ecr batch-delete-image --repository-name ${{ env.ECR_REPOSITORY }} --image-ids "$IMAGES"
              else
                echo "No images found in ${{ env.ECR_REPOSITORY }}"
              fi
            else
              echo "ECR repository ${{ env.ECR_REPOSITORY }} does not exist, skipping..."
            fi
            
            # Single wait for all LoadBalancer cleanup
            echo "Waiting 120s for LoadBalancer cleanup to complete..."
            sleep 120
            
            echo "✅ Pre-destroy cleanup completed"

      - name: Install ArgoCD
        if: steps.apply.outcome == 'success' && steps.getconfig.outcome == 'success'
        run: |
          # Create argocd namespace
          kubectl create namespace argocd
          # Install ArgoCD
          kubectl apply -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
          
          #!############################################################################################### 
          #!#################### TAKE OUT IF WE USE INGRESS CONTROLLER ####################################
          #!############################################################################################### 
          # Wait for ArgoCD with a more reasonable timeout for t3.small
          echo "Waiting for ArgoCD server deployment (this may take 5-10 minutes on t3.small)..."
          kubectl wait --for=condition=available deployment/argocd-server -n argocd --timeout=900s || {
            echo "ArgoCD server not fully ready yet, but continuing..."
            kubectl get pods -n argocd
          }
          # Expose ArgoCD via LoadBalancer
          kubectl patch svc argocd-server -n argocd -p '{"spec": {"type": "LoadBalancer"}}'            
          #!###############################################################################################
          #!############################################################################################### 
  
          echo "ArgoCD installation completed."
      
      - name: Get ArgoCD access info
        if: steps.apply.outcome == 'success' && steps.getconfig.outcome == 'success'
        id: argocd_info
        run: |
          # Get ArgoCD status
          echo "ArgoCD pod status:"
          kubectl get pods -n argocd
          echo ""
          
          # Wait a bit for LoadBalancer
          echo "Waiting for LoadBalancer to be provisioned..."
          sleep 60
          
          # Get external access information
          EXTERNAL_IP=$(kubectl get svc argocd-server -n argocd -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "pending")
          echo "ArgoCD will be accessible at: https://$EXTERNAL_IP"
          
          # Store ArgoCD URL as job output
          echo "argocd_url=https://$EXTERNAL_IP" >> $GITHUB_OUTPUT
          
          # Get admin password and store it securely
          ARGOCD_PASSWORD=$(kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath="{.data.password}" 2>/dev/null | base64 -d || echo "Password not ready yet")
          
          # Mask the password in logs to prevent it from being displayed
          echo "::add-mask::$ARGOCD_PASSWORD"
          
          # Store password as a job output (this is still secure within GitHub Actions)
          echo "argocd_password=$ARGOCD_PASSWORD" >> $GITHUB_OUTPUT
          
          # Optional: Store credentials in AWS Secrets Manager for long-term access
          aws secretsmanager create-secret \
            --name "argocd-${{ env.EKS_CLUSTER }}-credentials" \
            --description "ArgoCD credentials for ${{ env.EKS_CLUSTER }}" \
            --secret-string "{\"username\":\"admin\",\"password\":\"$ARGOCD_PASSWORD\",\"url\":\"https://$EXTERNAL_IP\"}" \
            --region ${{ env.AWS_REGION }} || \
          aws secretsmanager update-secret \
            --secret-id "argocd-${{ env.EKS_CLUSTER }}-credentials" \
            --secret-string "{\"username\":\"admin\",\"password\":\"$ARGOCD_PASSWORD\",\"url\":\"https://$EXTERNAL_IP\"}" \
            --region ${{ env.AWS_REGION }}
          
          echo "✅ ArgoCD credentials stored in AWS Secrets Manager"
          echo "Secret name: argocd-${{ env.EKS_CLUSTER }}-credentials"

      # Add a step to create a GitHub summary with access information
      - name: Create deployment summary
        if: steps.argocd_info.outcome == 'success'
        run: |
          echo "## 🚀 Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ArgoCD Access Information" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: ${{ steps.argocd_info.outputs.argocd_url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Username**: admin" >> $GITHUB_STEP_SUMMARY
          echo "- **Password**: Stored in AWS Secrets Manager" >> $GITHUB_STEP_SUMMARY
          echo "- **Secret Name**: \`argocd-${{ env.EKS_CLUSTER }}-credentials\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### How to retrieve the password:" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "aws secretsmanager get-secret-value --secret-id argocd-${{ env.EKS_CLUSTER }}-credentials --region ${{ env.AWS_REGION }} --query SecretString --output text | jq -r '.password'" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Alternative: Direct kubectl command:" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath=\"{.data.password}\" | base64 -d" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Configure ArgoCD Application
        if: steps.apply.outcome == 'success' && steps.getconfig.outcome == 'success'
        working-directory: ./  # Override the default terraform directory
        run: |
          # Apply the ArgoCD application from your repository
          kubectl apply -f argocd/quarterly-earnings-app.yaml
          
          # Verify application was created
          echo "Waiting for ArgoCD Application to be created..."
          for i in {1..30}; do
            if kubectl get application quarterly-earnings-tool -n argocd &> /dev/null; then
              echo "ArgoCD Application created successfully!"
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done
          
          echo "ArgoCD Application created. You can view it in the ArgoCD UI."


      - name: Run Terraform destroy
        if: failure()
        run: |
          terraform destroy -auto-approve -input=false


  # The below DELETE COMMAND needs to be triggered MANUALLY
  destroy:
    name: "Destroy Infra on AWS"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only trigger for workflow_dispatch
    if: github.event.inputs.action == 'destroy'

    defaults:
      run:
        shell: bash
        working-directory: ./terraform

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        id: init
        run: terraform init -backend-config="bucket=${{ env.S3_BUCKET }}" -backend-config="key=terraform/state/terraform.tfstate"
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get Kubernetes config
        id: getconfig
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER }} --region ${{ env.AWS_REGION }} 

      - name: Pre-destroy cleanup
        run: |
          echo "Starting comprehensive pre-destroy cleanup..."
          
          # Install jq if needed
          sudo apt-get update && sudo apt-get install -y jq
          
          # Delete ArgoCD Application first
          kubectl delete application quarterly-earnings-tool -n argocd --ignore-not-found=true --timeout=60s || true
          
          # Convert LoadBalancer to ClusterIP and delete namespace
          kubectl patch svc argocd-server -n argocd -p '{"spec":{"type":"ClusterIP"}}' --ignore-not-found=true || true
          sleep 30
          kubectl delete namespace argocd --ignore-not-found=true --timeout=180s || true
          
          # Clean up LoadBalancers more efficiently
          echo "Cleaning up LoadBalancers..."
          
          # Delete Application Load Balancers
          aws elbv2 describe-load-balancers \
            --query "LoadBalancers[?contains(LoadBalancerName, '${{ env.EKS_CLUSTER }}')].LoadBalancerArn" \
            --output text | while read -r lb_arn; do
            if [ ! -z "$lb_arn" ]; then
              echo "Deleting ALB/NLB: $lb_arn"
              aws elbv2 delete-load-balancer --load-balancer-arn "$lb_arn" || true
            fi
          done
          
          # Delete Classic Load Balancers
          aws elb describe-load-balancers \
            --query "LoadBalancerDescriptions[?contains(LoadBalancerName, '${{ env.EKS_CLUSTER }}')].LoadBalancerName" \
            --output text | while read -r lb_name; do
            if [ ! -z "$lb_name" ]; then
              echo "Deleting Classic LB: $lb_name"
              aws elb delete-load-balancer --load-balancer-name "$lb_name" || true
            fi
          done
          
          # Empty ECR Repository
          if aws ecr describe-repositories --repository-names ${{ env.ECR_REPOSITORY }} &>/dev/null; then
            IMAGES=$(aws ecr list-images --repository-name ${{ env.ECR_REPOSITORY }} --query 'imageIds[*]' --output json)
            if [ "$IMAGES" != "[]" ]; then
              echo "Deleting images from ${{ env.ECR_REPOSITORY }}..."
              aws ecr batch-delete-image --repository-name ${{ env.ECR_REPOSITORY }} --image-ids "$IMAGES"
            fi
          fi
          
          # Delete AWS Secrets Manager secret
          SECRET_NAME="argocd-${{ env.EKS_CLUSTER }}-credentials"
          if aws secretsmanager describe-secret --secret-id "$SECRET_NAME" &>/dev/null; then
            aws secretsmanager delete-secret --secret-id "$SECRET_NAME" --force-delete-without-recovery
            echo "✅ Deleted secret: $SECRET_NAME"
          fi
          
          # Single wait for all LoadBalancer cleanup
          echo "Waiting 120s for LoadBalancer cleanup to complete..."
          sleep 120
          
          echo "✅ Pre-destroy cleanup completed"
      
      - name: Extra AWS cleanup
        if: always()
        run: |
          VPC_ID=$(aws ec2 describe-vpcs --filters "Name=tag:Name,Values=${{ env.EKS_CLUSTER }}*" --query "Vpcs[0].VpcId" --output text)
          
          if [ "$VPC_ID" != "None" ] && [ "$VPC_ID" != "" ]; then
            echo "Found VPC: $VPC_ID"
            
            # Terminate EC2 instances first
            INSTANCE_IDS=$(aws ec2 describe-instances --filters "Name=vpc-id,Values=$VPC_ID" "Name=instance-state-name,Values=running,pending,stopping,stopped" --query "Reservations[*].Instances[*].InstanceId" --output text)
            if [ ! -z "$INSTANCE_IDS" ]; then
              echo "Terminating instances: $INSTANCE_IDS"
              echo "$INSTANCE_IDS" | xargs -n1 aws ec2 terminate-instances --instance-ids
              
              # Wait for instances to terminate
              echo "Waiting for instances to terminate..."
              sleep 60
            fi
            
            # Delete Load Balancers in this VPC
            echo "Deleting Load Balancers in VPC..."
            aws elbv2 describe-load-balancers --query "LoadBalancers[?VpcId=='$VPC_ID'].LoadBalancerArn" --output text | while read -r lb_arn; do
              if [ ! -z "$lb_arn" ]; then
                echo "Deleting ALB/NLB: $lb_arn"
                aws elbv2 delete-load-balancer --load-balancer-arn "$lb_arn" || true
              fi
            done
            
            # Delete Classic Load Balancers
            aws elb describe-load-balancers --query "LoadBalancerDescriptions[?VpcId=='$VPC_ID'].LoadBalancerName" --output text | while read -r lb_name; do
              if [ ! -z "$lb_name" ]; then
                echo "Deleting Classic LB: $lb_name"
                aws elb delete-load-balancer --load-balancer-name "$lb_name" || true
              fi
            done
            
            # Wait for Load Balancers to be deleted
            sleep 120
            
            # Delete NAT Gateways
            NAT_GATEWAYS=$(aws ec2 describe-nat-gateways --filter "Name=vpc-id,Values=$VPC_ID" "Name=state,Values=available" --query "NatGateways[*].NatGatewayId" --output text)
            if [ ! -z "$NAT_GATEWAYS" ]; then
              echo "Deleting NAT Gateways: $NAT_GATEWAYS"
              echo "$NAT_GATEWAYS" | xargs -n1 aws ec2 delete-nat-gateway --nat-gateway-id
              
              # Wait for NAT Gateways to be deleted
              echo "Waiting for NAT Gateways to be deleted..."
              sleep 180
            fi
            
            # Release Elastic IPs associated with NAT Gateways and instances
            echo "Releasing Elastic IPs..."
            EIPS=$(aws ec2 describe-addresses --filters "Name=domain,Values=vpc" --query "Addresses[*].AllocationId" --output text)
            if [ ! -z "$EIPS" ]; then
              echo "Found EIPs: $EIPS"
              for eip in $EIPS; do
                echo "Releasing EIP: $eip"
                aws ec2 release-address --allocation-id "$eip" || true
              done
            fi
            
            # Delete all ENIs in the VPC (except primary ENIs of running instances)
            echo "Deleting Network Interfaces..."
            ENIS=$(aws ec2 describe-network-interfaces --filters "Name=vpc-id,Values=$VPC_ID" --query "NetworkInterfaces[?Status=='available'].NetworkInterfaceId" --output text)
            if [ ! -z "$ENIS" ]; then
              echo "Found available ENIs: $ENIS"
              for eni in $ENIS; do
                echo "Deleting ENI: $eni"
                aws ec2 delete-network-interface --network-interface-id "$eni" || true
              done
            fi
            
            # Delete Security Group rules that reference other security groups
            echo "Cleaning up Security Group rules..."
            SG_IDS=$(aws ec2 describe-security-groups --filters "Name=vpc-id,Values=$VPC_ID" --query "SecurityGroups[?GroupName!='default'].GroupId" --output text)
            if [ ! -z "$SG_IDS" ]; then
              for sg_id in $SG_IDS; do
                echo "Cleaning rules for Security Group: $sg_id"
                # Remove ingress rules
                aws ec2 describe-security-groups --group-ids "$sg_id" --query "SecurityGroups[0].IpPermissions" --output json | \
                jq -c '.[]' 2>/dev/null | while read -r rule; do
                  aws ec2 revoke-security-group-ingress --group-id "$sg_id" --ip-permissions "$rule" 2>/dev/null || true
                done
                # Remove egress rules
                aws ec2 describe-security-groups --group-ids "$sg_id" --query "SecurityGroups[0].IpPermissionsEgress" --output json | \
                jq -c '.[]' 2>/dev/null | while read -r rule; do
                  aws ec2 revoke-security-group-egress --group-id "$sg_id" --ip-permissions "$rule" 2>/dev/null || true
                done
              done
            fi
            
            # Wait for all resources to be fully deleted
            sleep 60
            
          else
            echo "No VPC found with name pattern ${{ env.EKS_CLUSTER }}*"
          fi 

      # FINALLY, we execute `terraform destroy ...` command
      - name: Terraform destroy
        id: destroy
        if: always()
        run: terraform destroy -auto-approve -input=false